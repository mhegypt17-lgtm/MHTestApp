<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f7fa;
      color: #2c3e50;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    header p {
      opacity: 0.9;
      font-size: 14px;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e6ed;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 20px;
      background: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #7f8c8d;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-btn:hover {
      color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Section */
    .form-section {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-section h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #34495e;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
      grid-column: 1 / -1;
    }

    /* Product Items Section */
    .products-section {
      background: #f9fafb;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      grid-column: 1 / -1;
    }

    .products-section h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .product-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .product-item {
      background: white;
      padding: 12px;
      border-radius: 5px;
      border: 1px solid #e0e6ed;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .product-item input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .product-item textarea {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
    }

    .remove-product {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .remove-product:hover {
      background: #c0392b;
    }

    .add-product-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .add-product-btn:hover {
      background: #2980b9;
    }

    /* Buttons */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      grid-column: 1 / -1;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    .btn-secondary:hover {
      background: #d5dbdb;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-edit {
      background: #3498db;
      color: white;
      font-size: 12px;
      padding: 8px 12px;
    }

    .btn-edit:hover {
      background: #2980b9;
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #667eea;
    }

    .stat-card h3 {
      font-size: 12px;
      color: #7f8c8d;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #2c3e50;
    }

    .stat-card .subtext {
      font-size: 12px;
      color: #95a5a6;
      margin-top: 10px;
    }

    .stat-card.orders { border-left-color: #3498db; }
    .stat-card.revenue { border-left-color: #2ecc71; }
    .stat-card.delivered { border-left-color: #9b59b6; }
    .stat-card.pending { border-left-color: #f39c12; }

    /* Chart */
    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .chart-container h3 {
      font-size: 16px;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .source-chart {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .source-bar {
      flex: 1;
      height: 30px;
      background: #ecf0f1;
      border-radius: 4px;
      overflow: hidden;
    }

    .source-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s;
    }

    /* Orders Table/Grid */
    .orders-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .order-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #e0e6ed;
    }

    .order-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-id {
      font-weight: 600;
      font-size: 14px;
    }

    .order-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: rgba(243, 156, 18, 0.2);
      color: #f39c12;
    }

    .status-ready {
      background: rgba(52, 152, 219, 0.2);
      color: #3498db;
    }

    .status-delivered {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
    }

    .status-postponed {
      background: rgba(230, 126, 34, 0.2);
      color: #e67e22;
    }

    .order-body {
      padding: 15px;
    }

    .order-info {
      display: grid;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .order-info-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px;
    }

    .order-info-label {
      font-weight: 600;
      color: #7f8c8d;
    }

    .order-info-value {
      color: #2c3e50;
      word-break: break-word;
    }

    .order-products {
      background: #f9fafb;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 12px;
    }

    .order-products h4 {
      margin-bottom: 8px;
      color: #2c3e50;
    }

    .product-detail {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e6ed;
    }

    .product-detail:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .product-name {
      font-weight: 600;
      color: #2c3e50;
    }

    .product-qty {
      color: #7f8c8d;
    }

    .product-comment {
      color: #95a5a6;
      font-size: 11px;
      margin-top: 4px;
      font-style: italic;
    }

    .order-comment {
      background: #fff3cd;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #856404;
      border-left: 3px solid #ffc107;
    }

    .order-footer {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #f9fafb;
      border-top: 1px solid #e0e6ed;
    }

    .order-footer button {
      flex: 1;
    }

    /* Status Update Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .modal-content .form-group {
      margin-bottom: 15px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .orders-container {
        grid-template-columns: 1fr;
      }

      .product-item {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tabs {
        justify-content: flex-start;
        overflow-x: auto;
      }

      .stat-card .value {
        font-size: 24px;
      }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #95a5a6;
    }

    .empty-state p {
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h1>📦 Order Management System</h1>
    <p>Manage orders, track status, and view analytics</p>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('new-order')">➕ New Order</button>
    <button class="tab-btn" onclick="switchTab('orders')">📋 All Orders</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">📊 Dashboard</button>
  </div>

  <!-- NEW ORDER TAB -->
  <div id="new-order" class="tab-content active">
    <div class="form-section">
      <h2>Create New Order</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Order Source *</label>
          <select id="source" required>
            <option value="">Select source</option>
            <option value="app">Mobile App</option>
            <option value="voice">Voice Call</option>
          </select>
        </div>

        <div class="form-group">
          <label>Customer Name *</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="phone" placeholder="(123) 456-7890" required>
        </div>

        <div class="form-group">
          <label>Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="+1 987 654 3210" required>
        </div>

        <div class="form-group" style="grid-column: 1/-1;">
          <label>Delivery Address *</label>
          <textarea id="address" placeholder="Street address, city, postal code" required></textarea>
        </div>

        <div class="form-group" style="grid-column: 1/-1;">
          <label>Order Comments</label>
          <textarea id="orderComment" placeholder="Special notes for this order..."></textarea>
        </div>

        <!-- Products Section -->
        <div class="products-section">
          <h3>📦 Products/Items</h3>
          <div class="product-items" id="productItems"></div>
          <button type="button" class="add-product-btn" onclick="addProductItem()">+ Add Product</button>
        </div>

        <button type="button" class="btn btn-primary" onclick="createOrder()">Save Order</button>
      </div>
    </div>
  </div>

  <!-- ORDERS TAB -->
  <div id="orders" class="tab-content">
    <div class="orders-container" id="ordersContainer"></div>
  </div>

  <!-- DASHBOARD TAB -->
  <div id="dashboard" class="tab-content">
    <!-- Stats Cards -->
    <div class="dashboard-grid">
      <div class="stat-card orders">
        <h3>Total Orders</h3>
        <div class="value" id="totalOrders">0</div>
        <div class="subtext">All time</div>
      </div>

      <div class="stat-card revenue">
        <h3>Total Revenue</h3>
        <div class="value" id="totalRevenue">€0</div>
        <div class="subtext">Sum of all order values</div>
      </div>

      <div class="stat-card delivered">
        <h3>Delivered</h3>
        <div class="value" id="deliveredCount">0</div>
        <div class="subtext">Completed orders</div>
      </div>

      <div class="stat-card pending">
        <h3>Pending</h3>
        <div class="value" id="pendingCount">0</div>
        <div class="subtext">Not yet fulfilled</div>
      </div>
    </div>

    <!-- Source Chart -->
    <div class="chart-container">
      <h3>Orders by Source</h3>
      <div class="source-chart" id="sourceChart"></div>
    </div>

    <!-- Status Chart -->
    <div class="chart-container">
      <h3>Orders by Status</h3>
      <div class="source-chart" id="statusChart"></div>
    </div>
  </div>
</div>

<!-- Status Update Modal -->
<div id="statusModal" class="modal">
  <div class="modal-content">
    <h2>Update Order Status</h2>
    <div class="form-group">
      <label>New Status *</label>
      <select id="newStatus">
        <option value="pending">Pending</option>
        <option value="ready">Ready to Deliver</option>
        <option value="delivered">Delivered</option>
        <option value="postponed">Postponed</option>
      </select>
    </div>
    <div class="form-group">
      <label>Status Update Comment</label>
      <textarea id="statusComment" placeholder="Add any notes..."></textarea>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-secondary" onclick="closeStatusModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStatusUpdate()">Update Status</button>
    </div>
  </div>
</div>

<script>
// Data Management
let orders = JSON.parse(localStorage.getItem('orders')) || [];
let currentEditingOrderId = null;
let currentStatusOrderId = null;

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  addProductItem(); // Add first empty product item
  displayOrders();
  updateDashboard();
});

// Tab Switching
function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
  
  if (tabName === 'dashboard') {
    updateDashboard();
  } else if (tabName === 'orders') {
    displayOrders();
  }
}

// Add Product Item
function addProductItem() {
  const container = document.getElementById('productItems');
  const id = Date.now();
  
  const html = `
    <div class="product-item" id="product-${id}">
      <input type="text" placeholder="Product name" class="product-name" required>
      <input type="number" placeholder="Qty" min="1" class="product-qty" value="1" required>
      <input type="number" placeholder="Price (€)" step="0.01" min="0" class="product-price" required>
      <textarea placeholder="Product details/notes" class="product-comment"></textarea>
      <button type="button" class="remove-product" onclick="removeProductItem('product-${id}')">Remove</button>
    </div>
  `;
  
  container.insertAdjacentHTML('beforeend', html);
}

// Remove Product Item
function removeProductItem(id) {
  document.getElementById(id).remove();
}

// Create Order
function createOrder() {
  const source = document.getElementById('source').value;
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const mobile = document.getElementById('mobile').value;
  const address = document.getElementById('address').value;
  const orderComment = document.getElementById('orderComment').value;

  if (!source || !name || !phone || !mobile || !address) {
    alert('Please fill all required fields');
    return;
  }

  // Get products
  const products = [];
  document.querySelectorAll('.product-item').forEach(item => {
    const name = item.querySelector('.product-name').value;
    const qty = item.querySelector('.product-qty').value;
    const price = parseFloat(item.querySelector('.product-price').value) || 0;
    const comment = item.querySelector('.product-comment').value;
    
    if (name && qty && price) {
      products.push({ name, qty: parseInt(qty), price, comment, total: qty * price });
    }
  });

  if (products.length === 0) {
    alert('Please add at least one product');
    return;
  }

  const totalValue = products.reduce((sum, p) => sum + p.total, 0);

  const order = {
    id: Date.now(),
    source,
    name,
    phone,
    mobile,
    address,
    products,
    orderComment,
    totalValue,
    status: 'pending',
    statusUpdates: [],
    createdAt: new Date().toLocaleString()
  };

  orders.unshift(order);
  localStorage.setItem('orders', JSON.stringify(orders));

  // Reset form
  document.getElementById('source').value = '';
  document.getElementById('name').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('mobile').value = '';
  document.getElementById('address').value = '';
  document.getElementById('orderComment').value = '';
  document.getElementById('productItems').innerHTML = '';
  addProductItem();

  alert('Order created successfully!');
  displayOrders();
  updateDashboard();
}

// Display Orders
function displayOrders() {
  const container = document.getElementById('ordersContainer');
  
  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>No orders yet. Create one to get started!</p></div>';
    return;
  }

  container.innerHTML = orders.map(order => `
    <div class="order-card">
      <div class="order-header">
        <span class="order-id">Order #${order.id}</span>
        <span class="order-status status-${order.status}">${order.status.replace('_', ' ')}</span>
      </div>
      
      <div class="order-body">
        <div class="order-info">
          <div class="order-info-row">
            <span class="order-info-label">Customer:</span>
            <span class="order-info-value">${order.name}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Phone:</span>
            <span class="order-info-value">${order.phone}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Mobile:</span>
            <span class="order-info-value">${order.mobile}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Source:</span>
            <span class="order-info-value">${order.source === 'app' ? '📱 Mobile App' : '☎️ Voice Call'}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Address:</span>
            <span class="order-info-value">${order.address}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Value:</span>
            <span class="order-info-value" style="font-weight: 600; color: #2ecc71;">€${order.totalValue.toFixed(2)}</span>
          </div>
          <div class="order-info-row">
            <span class="order-info-label">Date:</span>
            <span class="order-info-value">${order.createdAt}</span>
          </div>
        </div>

        ${order.orderComment ? `<div class="order-comment">📝 ${order.orderComment}</div>` : ''}

        <div class="order-products">
          <h4>📦 Products</h4>
          ${order.products.map(p => `
            <div class="product-detail">
              <div class="product-name">${p.name}</div>
              <div class="product-qty">Qty: ${p.qty} × €${p.price.toFixed(2)} = €${p.total.toFixed(2)}</div>
              ${p.comment ? `<div class="product-comment">💬 ${p.comment}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="order-footer">
        <button class="btn btn-edit" onclick="openStatusModal(${order.id})">Update Status</button>
        <button class="btn btn-danger" onclick="deleteOrder(${order.id})">Delete</button>
      </div>
    </div>
  `).join('');
}

// Status Modal
function openStatusModal(orderId) {
  currentStatusOrderId = orderId;
  document.getElementById('statusModal').classList.add('active');
}

function closeStatusModal() {
  document.getElementById('statusModal').classList.remove('active');
  currentStatusOrderId = null;
}

function saveStatusUpdate() {
  const newStatus = document.getElementById('newStatus').value;
  const comment = document.getElementById('statusComment').value;

  const order = orders.find(o => o.id === currentStatusOrderId);
  if (order) {
    order.status = newStatus;
    order.statusUpdates.push({
      status: newStatus,
      comment,
      updatedAt: new Date().toLocaleString()
    });
    
    localStorage.setItem('orders', JSON.stringify(orders));
    displayOrders();
    updateDashboard();
    closeStatusModal();
    alert('Order status updated!');
  }

  document.getElementById('newStatus').value = 'pending';
  document.getElementById('statusComment').value = '';
}

// Delete Order
function deleteOrder(orderId) {
  if (confirm('Are you sure you want to delete this order?')) {
    orders = orders.filter(o => o.id !== orderId);
    localStorage.setItem('orders', JSON.stringify(orders));
    displayOrders();
    updateDashboard();
  }
}

// Dashboard
function updateDashboard() {
  const totalOrders = orders.length;
  const totalRevenue = orders.reduce((sum, o) => sum + o.totalValue, 0);
  const deliveredCount = orders.filter(o => o.status === 'delivered').length;
  const pendingCount = orders.filter(o => o.status === 'pending').length;

  document.getElementById('totalOrders').textContent = totalOrders;
  document.getElementById('totalRevenue').textContent = '€' + totalRevenue.toFixed(2);
  document.getElementById('deliveredCount').textContent = deliveredCount;
  document.getElementById('pendingCount').textContent = pendingCount;

  // Source Chart
  const sources = { app: 0, voice: 0 };
  orders.forEach(o => sources[o.source]++);
  
  const maxSource = Math.max(...Object.values(sources), 1);
  const sourceChart = document.getElementById('sourceChart');
  sourceChart.innerHTML = `
    <div class="source-item">
      <span style="width: 50px;">📱 App</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(sources.app/maxSource)*100}%"></div>
      </div>
      <span>${sources.app}</span>
    </div>
    <div class="source-item">
      <span style="width: 50px;">☎️ Voice</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(sources.voice/maxSource)*100}%"></div>
      </div>
      <span>${sources.voice}</span>
    </div>
  `;

  // Status Chart
  const statuses = { pending: 0, ready: 0, delivered: 0, postponed: 0 };
  orders.forEach(o => statuses[o.status]++);
  
  const maxStatus = Math.max(...Object.values(statuses), 1);
  const statusChart = document.getElementById('statusChart');
  statusChart.innerHTML = `
    <div class="source-item">
      <span style="width: 80px;">⏳ Pending</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(statuses.pending/maxStatus)*100}%"></div>
      </div>
      <span>${statuses.pending}</span>
    </div>
    <div class="source-item">
      <span style="width: 80px;">✅ Ready</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(statuses.ready/maxStatus)*100}%"></div>
      </div>
      <span>${statuses.ready}</span>
    </div>
    <div class="source-item">
      <span style="width: 80px;">🚚 Delivered</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(statuses.delivered/maxStatus)*100}%"></div>
      </div>
      <span>${statuses.delivered}</span>
    </div>
    <div class="source-item">
      <span style="width: 80px;">⏸️ Postponed</span>
      <div class="source-bar">
        <div class="source-bar-fill" style="width: ${(statuses.postponed/maxStatus)*100}%"></div>
      </div>
      <span>${statuses.postponed}</span>
    </div>
  `;
}
</script>

</body>
</html>
