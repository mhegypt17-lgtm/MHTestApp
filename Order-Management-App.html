<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; 
                   padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; }
        .header .stats { display: flex; gap: 20px; }
        .stat-box { background: rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 8px; text-align: center; }
        .stat-box .number { font-size: 24px; font-weight: bold; }
        .stat-box .label { font-size: 11px; opacity: 0.9; }

        /* Container */
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }

        /* Form */
        .form-card { background: white; border-radius: 12px; padding: 25px; 
                     box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .form-card h2 { margin-bottom: 15px; color: #1a73e8; font-size: 18px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ddd; 
                border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
        .btn-row { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; 
               cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:hover { background: #1557b0; }
        .btn-secondary { background: #e8eaed; color: #333; }
        .btn-secondary:hover { background: #d2d5d9; }
        .btn-danger { background: #ea4335; color: white; padding: 6px 12px; font-size: 12px; }
        .btn-danger:hover { background: #c5221f; }
        .btn-edit { background: #fbbc04; color: #333; padding: 6px 12px; font-size: 12px; }
        .btn-edit:hover { background: #e0a800; }
        .btn-export { background: #34a853; color: white; }
        .btn-export:hover { background: #2d8e47; }

        /* Search */
        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input, .search-bar select { padding: 10px; border: 1px solid #ddd; 
                border-radius: 8px; font-size: 14px; outline: none; }
        .search-bar input { flex: 1; min-width: 200px; }

        /* Table */
        .table-card { background: white; border-radius: 12px; padding: 20px; 
                      box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        .table-card h2 { margin-bottom: 15px; color: #1a73e8; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; font-size: 12px; 
             color: #666; text-transform: uppercase; border-bottom: 2px solid #e8eaed; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #f8f9ff; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-new { background: #e8f0fe; color: #1a73e8; }
        .badge-processing { background: #fef7e0; color: #e37400; }
        .badge-shipped { background: #e6f4ea; color: #1e8e3e; }
        .badge-delivered { background: #ceead6; color: #137333; }
        .badge-cancelled { background: #fce8e6; color: #c5221f; }
        .actions { display: flex; gap: 6px; }
        .empty-state { text-align: center; padding: 40px; color: #999; }

        @media (max-width: 600px) {
            .header { flex-direction: column; gap: 10px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- HEADER WITH STATS -->
<div class="header">
    <h1>📦 Order Management System</h1>
    <div class="stats">
        <div class="stat-box">
            <div class="number" id="totalOrders">0</div>
            <div class="label">Total Orders</div>
        </div>
        <div class="stat-box">
            <div class="number" id="totalRevenue">$0</div>
            <div class="label">Revenue</div>
        </div>
        <div class="stat-box">
            <div class="number" id="pendingOrders">0</div>
            <div class="label">Pending</div>
        </div>
    </div>
</div>

<div class="container">

    <!-- ORDER FORM -->
    <div class="form-card">
        <h2 id="formTitle">➕ New Order</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="customerName" placeholder="e.g. Ahmed Hassan">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="phone" placeholder="e.g. +20 100 123 4567">
            </div>
            <div class="form-group">
                <label>Product</label>
                <input type="text" id="product" placeholder="e.g. Laptop Dell XPS">
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="1" min="1" value="1">
            </div>
            <div class="form-group">
                <label>Unit Price ($)</label>
                <input type="number" id="price" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="New">🔵 New</option>
                    <option value="Processing">🟡 Processing</option>
                    <option value="Shipped">🟢 Shipped</option>
                    <option value="Delivered">✅ Delivered</option>
                    <option value="Cancelled">🔴 Cancelled</option>
                </select>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveOrder()">💾 Save Order</button>
            <button class="btn btn-secondary" onclick="clearForm()">🔄 Clear</button>
            <button class="btn btn-export" onclick="exportCSV()">📥 Export CSV</button>
        </div>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="search-bar">
        <input type="text" id="searchBox" placeholder="🔍 Search by customer or product..." oninput="renderOrders()">
        <select id="filterStatus" onchange="renderOrders()">
            <option value="">All Statuses</option>
            <option value="New">🔵 New</option>
            <option value="Processing">🟡 Processing</option>
            <option value="Shipped">🟢 Shipped</option>
            <option value="Delivered">✅ Delivered</option>
            <option value="Cancelled">🔴 Cancelled</option>
        </select>
    </div>

    <!-- ORDERS TABLE -->
    <div class="table-card">
        <h2>📋 Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
        <div class="empty-state" id="emptyState">No orders yet — create your first order above! 🚀</div>
    </div>
</div>

<script>
    // ===== LOCAL STORAGE FUNCTIONS =====
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    let editingId = null;

    function saveToStorage() {
        localStorage.setItem('orders', JSON.stringify(orders));
    }

    // ===== SAVE / UPDATE ORDER =====
    function saveOrder() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const product = document.getElementById('product').value.trim();
        const quantity = parseInt(document.getElementById('quantity').value) || 0;
        const price = parseFloat(document.getElementById('price').value) || 0;
        const status = document.getElementById('status').value;

        if (!name || !product || quantity <= 0 || price <= 0) {
            alert('Please fill in all fields correctly.');
            return;
        }

        if (editingId) {
            // Update existing order
            const order = orders.find(o => o.id === editingId);
            if (order) {
                order.customer = name;
                order.phone = phone;
                order.product = product;
                order.quantity = quantity;
                order.price = price;
                order.status = status;
            }
            editingId = null;
            document.getElementById('formTitle').textContent = '➕ New Order';
        } else {
            // Create new order
            const order = {
                id: Date.now(),
                orderNum: 'ORD-' + String(orders.length + 1).padStart(4, '0'),
                customer: name,
                phone: phone,
                product: product,
                quantity: quantity,
                price: price,
                status: status,
                date: new Date().toLocaleDateString('en-GB')
            };
            orders.unshift(order);
        }

        saveToStorage();
        clearForm();
        renderOrders();
    }

    // ===== EDIT ORDER =====
    function editOrder(id) {
        const order = orders.find(o => o.id === id);
        if (!order) return;
        document.getElementById('customerName').value = order.customer;
        document.getElementById('phone').value = order.phone;
        document.getElementById('product').value = order.product;
        document.getElementById('quantity').value = order.quantity;
        document.getElementById('price').value = order.price;
        document.getElementById('status').value = order.status;
        editingId = id;
        document.getElementById('formTitle').textContent = '✏️ Edit Order: ' + order.orderNum;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== DELETE ORDER =====
    function deleteOrder(id) {
        if (!confirm('Are you sure you want to delete this order?')) return;
        orders = orders.filter(o => o.id !== id);
        saveToStorage();
        renderOrders();
    }

    // ===== CLEAR FORM =====
    function clearForm() {
        document.getElementById('customerName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('product').value = '';
        document.getElementById('quantity').value = '1';
        document.getElementById('price').value = '';
        document.getElementById('status').value = 'New';
        editingId = null;
        document.getElementById('formTitle').textContent = '➕ New Order';
    }

    // ===== RENDER ORDERS TABLE =====
    function renderOrders() {
        const search = document.getElementById('searchBox').value.toLowerCase();
        const filterStatus = document.getElementById('filterStatus').value;

        let filtered = orders.filter(o => {
            const matchSearch = o.customer.toLowerCase().includes(search) || 
                                o.product.toLowerCase().includes(search);
            const matchStatus = !filterStatus || o.status === filterStatus;
            return matchSearch && matchStatus;
        });

        const tbody = document.getElementById('ordersTable');
        const emptyState = document.getElementById('emptyState');

        if (filtered.length === 0) {
            tbody.innerHTML = '';
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
            tbody.innerHTML = filtered.map(o => `
                <tr>
                    <td><strong>${o.orderNum}</strong></td>
                    <td>${o.customer}</td>
                    <td>${o.phone}</td>
                    <td>${o.product}</td>
                    <td>${o.quantity}</td>
                    <td>$${o.price.toFixed(2)}</td>
                    <td><strong>$${(o.quantity * o.price).toFixed(2)}</strong></td>
                    <td><span class="badge badge-${o.status.toLowerCase()}">${o.status}</span></td>
                    <td>${o.date}</td>
                    <td class="actions">
                        <button class="btn btn-edit" onclick="editOrder(${o.id})">✏️</button>
                        <button class="btn btn-danger" onclick="deleteOrder(${o.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        // Update dashboard stats
        document.getElementById('totalOrders').textContent = orders.length;
        const revenue = orders.filter(o => o.status !== 'Cancelled')
                              .reduce((sum, o) => sum + (o.quantity * o.price), 0);
        document.getElementById('totalRevenue').textContent = '$' + revenue.toFixed(0);
        const pending = orders.filter(o => o.status === 'New' || o.status === 'Processing').length;
        document.getElementById('pendingOrders').textContent = pending;
    }

    // ===== EXPORT TO CSV =====
    function exportCSV() {
        if (orders.length === 0) { alert('No orders to export!'); return; }
        const headers = ['Order#', 'Customer', 'Phone', 'Product', 'Qty', 'Price', 'Total', 'Status', 'Date'];
        const rows = orders.map(o => [
            o.orderNum, o.customer, o.phone, o.product, 
            o.quantity, o.price, (o.quantity * o.price).toFixed(2), o.status, o.date
        ]);
        const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'orders_export.csv';
        a.click();
    }

    // ===== INIT =====
    renderOrders();
</script>

</body>
</html>
